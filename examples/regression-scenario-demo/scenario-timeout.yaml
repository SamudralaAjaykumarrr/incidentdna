# IncidentDNA IRS v0.1 scenario document — synthetic example.
#
# The TIMEOUT outcome demonstration: sleeps for 5 seconds against a declared
# timeout_seconds of 1, so `scenario run` kills the process and reports
# TIMEOUT in bounded wall-clock time (not hanging for the full 5 seconds).
# command[0] is /bin/sleep, an ordinary coreutils binary already present in
# the golang:* base image the dev container uses — no substitution needed.
schema_version: irs/v0.1

scenario:
  id: duplicate-payment-refingerprint-timeout
  title: Command exceeds its declared timeout, to demonstrate the TIMEOUT outcome
  description: >
    Runs a command that sleeps well past a deliberately short
    timeout_seconds, demonstrating that scenario run kills the process and
    classifies the result as TIMEOUT rather than hanging.

linked_fingerprint: "sha256:fc3dac016d31dcca1a58c0242c45474107dd69c1e7718d9cdebdbe357bca2a8e"

execution:
  command:
    - "/bin/sleep"
    - "5"
  timeout_seconds: 1

expected:
  exit_code: 0
